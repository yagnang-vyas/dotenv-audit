# Netlify deploys the web playground in web/. The CLI package at the
# repository root is not affected; web/ imports its engine from src/ at build time.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Skip deploys when neither the site nor the engine it bundles changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../src ../package.json ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes. Static files (assets, theme.js, favicon) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # No inline scripts, no third-party origins, and no network requests from the page.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
